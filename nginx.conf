server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Ручная загрузка выгрузки ЕМИСС (POST /api/v1/admin/integrations/ROSSTAT/upload):
        # дефолт nginx — 1 МБ, а полная SDMX-выгрузка показателя весит 65 МБ (413 без этой
        # строки). Лимит согласован с EMIS_UPLOAD_MAX_FILE_SIZE / max-response-bytes бэкенда
        # (96 МБ) и с MAX_UPLOAD_BYTES во фронте.
        client_max_body_size 96m;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
