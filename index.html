<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- bugs-trip-menu-stage п.6: viewport-fit=cover ОБЯЗАТЕЛЕН — без него на iOS
         webview не заходит под home-indicator, env(safe-area-inset-*) всегда 0,
         и в PWA-standalone под фиксированным .stage-bar оставалась полоса
         системного фона («зазор»). Весь safe-area-паддинг (бар, модалки, топбар,
         scroll-top) уже заложен в index.css — meta его активирует. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://meal-provisioning-ai.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
    <title>Провиант — Планировщик питания для походов</title>
    <!-- Fix-10 (п.5): «стили красоты» дизайн-кода в деле — OG-карточка
         (og-cover.png из design-pack копируется в dist плагином vite) +
         theme-color под бренд-фон тёмной темы (tokens.css --bg-0). -->
    <meta name="description" content="Меню по дням, закупки, чеки и отчёты для походов — всё в одном месте.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Провиант — планировщик питания для походов">
    <meta property="og:description" content="Меню по дням, закупки, чеки и отчёты для походов — всё в одном месте.">
    <meta property="og:image" content="/og-cover.png">
    <meta name="twitter:card" content="summary_large_image">
    <!-- theme-color: дефолт — тёмная тема приложения (--bg-0 dark, tokens.css);
         media-вариант для светлой ОС-темы — --bg-0 light (#F5F2EB). Значения —
         токены дизайн-пака, синхронны с manifest.json (подзадача 5, KB-38). -->
    <meta name="theme-color" content="#0B141B">
    <meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)">
    <!-- DESIGN_MIGRATION 2.6: знак v4 из design-pack assets/, инлайн-SVG favicon убран -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">

    <!-- BL-28: PWA. Манифест и service worker отдаёт плагин pwa-assets (src/pwa/*):
         build → корень dist, dev → middleware. sw.js в корне сайта — иначе его
         scope не покрывает всё приложение. Иконки — из design-pack app-icon.svg
         (public/icons/), apple-touch-icon для «На экран Домой» на iOS. -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="application-name" content="Провиант">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Провиант">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- DESIGN_MIGRATION 0.1: токены дизайн-кода подключаются ПЕРВЫМИ (единственный
         источник правды), до инлайн-стилов и до src/index.css -->
    <link rel="stylesheet" href="/provisions/design-pack/tokens.css">

    <!-- Шрифты дизайн-системы «Провиант» — self-host (подзадача 5, аудит 02.11.2026,
         KB-38): woff2 лежат в public/fonts/, @font-face — в src/index.css.
         Внешние fonts.googleapis.com/gstatic удалены: prod-CSP (font-src/style-src
         'self') их блокировала, брендовые шрифты в docker-prod не применялись.
         Same-origin: шрифты кэширует service worker, third-party-зависимости нет.
         Preload основных срезов — текст первого пейнта рисуется брендовым Manrope
         без ожидания CSS-бандла (font-display: swap — без сдвигов макета). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/manrope-latin.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/manrope-cyrillic.woff2">

    <style>
      /* Инлайн-стили только structural (без цветов вне токенов): фон/текст — из tokens.css */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-0);
        color: var(--text-1);
      }

      /* Fix-11: мгновенный boot-лоадер — брендовый парус design-pack виден СРАЗУ
         (статичный HTML+SVG, не ждёт JS/CSS-бандл); React затрёт #root при
         монтаже и передаст эстафету PageLoader/контенту. Цвета — токены темы
         с hex-фолбэками (tokens.css может ещё не доехать). */
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg-0, #0B141B);
      }
      [data-theme="light"] .boot-loader { background: var(--bg-0, #F5F2EB); }
      .boot-loader img {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 0 18px rgba(240, 138, 46, 0.35));
      }
      .boot-loader span {
        font: 600 12px/1 system-ui, "Segoe UI", sans-serif;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--text-3, rgba(245, 242, 234, 0.55));
        animation: boot-breathe 1.8s ease-in-out infinite;
      }
      [data-theme="light"] .boot-loader span { color: var(--text-3, rgba(11, 20, 27, 0.5)); }
      @keyframes boot-breathe {
        0%, 100% { opacity: .45; }
        50%      { opacity: 1; }
      }
    </style>
    <script>
      // Тема до загрузки React: data-theme на <html>, персист localStorage['pv-theme']
      // (try/catch), дефолт dark — по design-pack tokens.json → themeSwitch.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("pv-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) { /* localStorage недоступен — остаёмся на дефолте */ }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Fix-11: статичный boot-лоадер (парус design-pack) — виден до загрузки
           JS-бандла; React очистит #root при первом рендере. -->
      <div class="boot-loader" role="status" aria-label="Приложение загружается">
        <img src="/provisions/design-pack/assets/preloader.svg" alt="" onerror="this.style.display='none'">
        <span>Провиант</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
