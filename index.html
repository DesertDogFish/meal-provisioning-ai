<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Провиант — Планировщик питания для походов</title>
    <!-- DESIGN_MIGRATION 2.6: знак v4 из design-pack assets/, инлайн-SVG favicon убран -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">

    <!-- DESIGN_MIGRATION 0.1: токены дизайн-кода подключаются ПЕРВЫМИ (единственный
         источник правды), до инлайн-стилов и до src/index.css -->
    <link rel="stylesheet" href="/provisions/design-pack/tokens.css">

    <!-- Шрифты дизайн-системы «Провиант» -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* Инлайн-стили только structural (без цветов вне токенов): фон/текст — из tokens.css */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-0);
        color: var(--text-1);
      }
    </style>
    <script>
      // Тема до загрузки React: data-theme на <html>, персист localStorage['pv-theme']
      // (try/catch), дефолт dark — по design-pack tokens.json → themeSwitch.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("pv-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) { /* localStorage недоступен — остаёмся на дефолте */ }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
