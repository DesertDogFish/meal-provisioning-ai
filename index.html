<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Провиант — Планировщик питания для походов</title>
    <!-- Fix-10 (п.5): «стили красоты» дизайн-кода в деле — OG-карточка
         (og-cover.png из design-pack копируется в dist плагином vite) +
         theme-color под бренд-фон тёмной темы (tokens.css --bg-0). -->
    <meta name="description" content="Меню по дням, закупки, чеки и отчёты для походов — всё в одном месте.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Провиант — планировщик питания для походов">
    <meta property="og:description" content="Меню по дням, закупки, чеки и отчёты для походов — всё в одном месте.">
    <meta property="og:image" content="/og-cover.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0B141B">
    <!-- DESIGN_MIGRATION 2.6: знак v4 из design-pack assets/, инлайн-SVG favicon убран -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">

    <!-- DESIGN_MIGRATION 0.1: токены дизайн-кода подключаются ПЕРВЫМИ (единственный
         источник правды), до инлайн-стилов и до src/index.css -->
    <link rel="stylesheet" href="/provisions/design-pack/tokens.css">

    <!-- Шрифты дизайн-системы «Провиант» -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* Инлайн-стили только structural (без цветов вне токенов): фон/текст — из tokens.css */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-0);
        color: var(--text-1);
      }
    </style>
    <script>
      // Тема до загрузки React: data-theme на <html>, персист localStorage['pv-theme']
      // (try/catch), дефолт dark — по design-pack tokens.json → themeSwitch.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("pv-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) { /* localStorage недоступен — остаёмся на дефолте */ }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
