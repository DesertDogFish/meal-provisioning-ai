name: Contract parity (mock vs real)

on:
  schedule:
    - cron: '0 3 * * *'  # Каждый день в 3:00 UTC
  workflow_dispatch:

jobs:
  contract:
    name: Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 # postgres:15-alpine
        env:
          POSTGRES_DB: provision_test
          POSTGRES_USER: provision
          POSTGRES_PASSWORD: ci_ephemeral_pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provision -d provision_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5
      
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Start backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/provision_test
          SPRING_DATASOURCE_USERNAME: provision
          SPRING_DATASOURCE_PASSWORD: ci_ephemeral_pg
          JWT_SECRET: ci-only-secret-key-not-for-production-0123456789abcdef
        run: |
          nohup mvn -B -ntp spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:8080/api/v1/meta && break || sleep 3
          done
      
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      
      - run: npm ci
      
      - name: Contract vs MOCK
        run: npm run test:contract
        env:
          CONTRACT_TARGET: mock
      
      - name: Contract vs REAL
        run: npm run test:contract
        env:
          CONTRACT_TARGET: real
          VITE_API_URL: http://localhost:8080
      
      - name: Backend log on failure
        if: failure()
        run: tail -n 80 /tmp/backend.log
