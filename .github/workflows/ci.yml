name: CI

on:
  push:
    branches: [main, 'provision-**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'  # синхронно с backend/pom.xml (<java.version>17</java.version>)
          cache: maven
      

      # Интеграционные тесты (Integration*) работают без Docker-демона через
      # LocalPgFallback (initdb/pg_ctl). Ставим серверный пакет PostgreSQL заранее —
      # fallback сам пакеты не устанавливает.
      # FIX (exit 100): ubuntu-latest переехал на Ubuntu 24.04, где в стандартных
      # репозиториях нет postgresql-15 (там 16/17) → "Unable to locate package".
      # Добавлен PGDG-репозиторий (postgresql.org) для pinning версии 15; если и он
      # недоступен — фолбэк на любой доступный серверный пакет PostgreSQL
      # (LocalPgFallback.detectPgBin() выбирает максимальный установленный мажор).
      - name: Install PostgreSQL 15 (for LocalPgFallback integration tests)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          if ! apt-cache show postgresql-15 >/dev/null 2>&1; then
            echo "::notice::postgresql-15 not in distro repos — adding PGDG repository"
            sudo apt-get install -yq --no-install-recommends curl ca-certificates gnupg
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql-pgdg.gpg
            echo "deb [signed-by=/etc/apt/keyrings/postgresql-pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -qq
          fi
          if apt-cache show postgresql-15 >/dev/null 2>&1; then
            sudo apt-get install -yq --no-install-recommends postgresql-15
          else
            echo "::warning::postgresql-15 unavailable on this runner image — installing default server package instead"
            sudo apt-get install -yq --no-install-recommends postgresql
          fi
          psql --version || true
          ls /usr/lib/postgresql/
      - name: Backend tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-key-for-jwt-tokens-must-be-at-least-256-bits-long-hs256-ok
        run: mvn -B -ntp test
      
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - run: npm ci
      
      - run: npm run lint
      
      # FIX (T0, гейты CI): typecheck как отдельный blocking-шаг — ловит ошибки
      # вроде parseDate в DatePicker.tsx (react-datepicker v9), которые vite build
      # не проверяет (esbuild стирает типы).
      - name: Typecheck
        run: npm run typecheck
      
      - run: npm run build
      
      - name: Frontend tests
        run: npm run test
      
      - name: Check MD files (non-blocking)
        continue-on-error: true  # TODO: через неделю перевести в blocking (exit 1)
        run: |
          count=$(git ls-files '*.md' | grep -v '^backend/README.md$' | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::warning::Expected 4 MD files (README.md, ARCHITECTURE.md, PLAN.md, AGENTS.md), found $count"
            git ls-files '*.md'
          else
            echo "✅ MD files check passed: 4 files"
          fi
      
      - name: Upload vitest reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest
          path: coverage/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      # compose fail-fast без JWT_SECRET (${JWT_SECRET:?...}) — задаём CI-only секрет.
      # Значение не используется в рантайме (config/build только интерполируют файл),
      # уникальный рабочий секрет генерируется в workflow docker-stack.yml.
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-key-not-for-production-0123456789abcdef|" .env
          grep -q "^JWT_SECRET=" .env && echo "JWT_SECRET set"
      
      - run: docker compose config -q
      
      - run: docker build -t provision-backend:ci ./backend
      
      - run: docker build -t provision-frontend:ci -f Dockerfile.frontend .

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Semgrep (non-blocking)
        continue-on-error: true  # TODO: починить docker-compose security_opt/read_only и nginx H2C, затем вернуть blocking
        run: |
          pip install semgrep
          semgrep scan --config auto
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true  # Dependency graph может быть отключён в приватных репо
      
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true  # Rate limit 429 от Maven Central — временная проблема CI
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
