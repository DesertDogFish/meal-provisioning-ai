name: CI

on:
  push:
    branches: [main, 'provision-**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BL-46 / KB-26: гейт на UTF-8 BOM. `fix-encoding.ps1` удалён — BOM в дереве больше
  # нет, а регрессию (PowerShell Out-File, редактор с «UTF-8 with BOM») ловит этот
  # блокирующий шаг: любой отслеживаемый файл, начинающийся с EF BB BF, валит сборку.
  # Проверяются именно первые три байта файла (а не вхождение байтов в тексте), чтобы
  # не ловить легитимный U+FEFF внутри содержимого.
  hygiene:
    name: Repo Hygiene (no BOM, no dup migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5

      - name: Java version consistency (BL-37)
        run: |
          set -euo pipefail
          wf=$(grep -rhoE "java-version: .?[0-9]+.?" .github/workflows/*.yml | grep -oE "[0-9]+" | sort -u)
          pom=$(grep -oP '(?<=<maven.compiler.release>)[0-9]+' backend/pom.xml | head -1)
          [ -z "$pom" ] && pom=$(grep -oP '(?<=<java.version>)[0-9]+' backend/pom.xml | head -1)
          docker=$(grep -hoE "temurin[-:][0-9]+" backend/Dockerfile | grep -oE "[0-9]+" | sort -u)
          echo "workflow java-versions: $(echo $wf | tr '\n' ' ')"
          echo "pom maven.compiler.release: $pom"
          echo "docker temurin: $(echo $docker | tr '\n' ' ')"
          [ "$(echo $wf | tr ' ' '\n' | sort -u | wc -l)" -eq 1 ] || { echo "::error::несколько разных java-version в workflow"; exit 1; }
          [ "$wf" = "$pom" ] || { echo "::error::workflow($wf) != pom($pom)"; exit 1; }
          [ "$wf" = "$docker" ] || { echo "::error::workflow($wf) != docker($docker)"; exit 1; }
          echo "OK: Java version едина — $wf"

      # KB-36 (аудит 02.11.2026): дубль V30 (два файла с одним номером) дожил до HEAD —
      # Flyway падает на resolve, backend не стартует, но ловилось это только поздним
      # падением тяжёлых job'ов. Быстрый страж: два файла с одинаковым Vn — ошибка.
      # AGENTS.md §11: следующий номер миграции = максимум в каталоге + 1.
      - name: No duplicate Flyway migration versions
        run: |
          set -euo pipefail
          dups=$(ls backend/src/main/resources/db/migration | grep -oE '^V[0-9]+' | sort | uniq -d || true)
          if [ -n "$dups" ]; then
            echo "::error::Дубли номеров Flyway-миграций (AGENTS.md §11 — следующий номер = максимум + 1):"
            for v in $dups; do
              echo "  $v:"
              ls backend/src/main/resources/db/migration | grep -E "^${v}__" | sed 's/^/    /'
            done
            exit 1
          fi
          echo "OK: дублей номеров миграций нет ($(ls backend/src/main/resources/db/migration | wc -l) файлов)"

      - name: No UTF-8 BOM in tracked files
        run: |
          set -euo pipefail
          bad=()
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            if [ "$(head -c 3 -- "$f" | od -An -tx1 | tr -d '[:space:]')" = "efbbbf" ]; then
              bad+=("$f")
            fi
          done < <(git ls-files -z)
          if [ "${#bad[@]}" -gt 0 ]; then
            echo "::error::UTF-8 BOM найден в отслеживаемых файлах:"
            for f in "${bad[@]}"; do echo "  $f"; done
            echo "Снять BOM: удалить первые три байта EF BB BF (сохранить файл как UTF-8 без BOM)."
            echo "PowerShell Out-File добавляет BOM — для исходников использовать другой инструмент."
            exit 1
          fi
          echo "OK: BOM не найден, проверено $(git ls-files | wc -l) файлов"

  commitlint:
    name: Conventional Commits (BL-39)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate commit messages / PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          types='feat|fix|refactor|test|docs|chore|ci|perf'
          pattern="^(${types})(\\([a-z0-9._/-]+\\))?!?: .{1,}$"
          if [ "$EVENT" = "pull_request" ]; then
            msg="$PR_TITLE"
          else
            msg="$(git log -1 --pretty=%s)"
          fi
          echo "checking: $msg"
          if ! printf '%s' "$msg" | grep -Eq "$pattern"; then
            echo "::error::Заголовок не соответствует Conventional Commits: '$msg'"
            echo "Ожидается: type(scope): subject, type ∈ {feat,fix,refactor,test,docs,chore,ci,perf}"
            exit 1
          fi
          if [ "${#msg}" -gt 100 ]; then
            echo "::error::Заголовок длиннее 100 символов"
            exit 1
          fi
          echo "OK: conventional commit title"

  backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5
      
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'  # синхронно с backend/pom.xml (<java.version>21</java.version>)
          cache: maven
      

      # Интеграционные тесты (Integration*) работают без Docker-демона через
      # LocalPgFallback (initdb/pg_ctl). Ставим серверный пакет PostgreSQL заранее —
      # fallback сам пакеты не устанавливает.
      # FIX (exit 100): ubuntu-latest переехал на Ubuntu 24.04, где в стандартных
      # репозиториях нет postgresql-15 (там 16/17) → "Unable to locate package".
      # Добавлен PGDG-репозиторий (postgresql.org) для pinning версии 15; если и он
      # недоступен — фолбэк на любой доступный серверный пакет PostgreSQL
      # (LocalPgFallback.detectPgBin() выбирает максимальный установленный мажор).
      - name: Install PostgreSQL 15 (for LocalPgFallback integration tests)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          if ! apt-cache show postgresql-15 >/dev/null 2>&1; then
            echo "::notice::postgresql-15 not in distro repos — adding PGDG repository"
            sudo apt-get install -yq --no-install-recommends curl ca-certificates gnupg
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql-pgdg.gpg
            echo "deb [signed-by=/etc/apt/keyrings/postgresql-pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -qq
          fi
          if apt-cache show postgresql-15 >/dev/null 2>&1; then
            sudo apt-get install -yq --no-install-recommends postgresql-15
          else
            echo "::warning::postgresql-15 unavailable on this runner image — installing default server package instead"
            sudo apt-get install -yq --no-install-recommends postgresql
          fi
          psql --version || true
          ls /usr/lib/postgresql/
      # KB-37 (аудит 02.11.2026): прежний отдельный шаг `jacoco:check@coverage-gate`
      # не работал — профиль не активировался, id execution не совпадал с селектором,
      # а threshold=60 при шкале COVEREDRATIO 0.0–1.0 означал 6000 %. Теперь гейт —
      # часть `verify` в профиле coverage-gate (один шаг вместе с тестами, exec-файл
      # от prepare-agent уже на месте), порог — <minimum> в долях.
      - name: Backend tests + coverage gate (JaCoCo LINE >= 0.60)
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-key-for-jwt-tokens-must-be-at-least-256-bits-long-hs256-ok
        run: mvn -B -ntp -P coverage-gate verify
      - name: Publish coverage to summary
        if: always()
        working-directory: backend
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9} END {
              printf "### Backend JaCoCo (LINE)\n\n**%.2f%%** (%d covered / %d total)\n", \
                covered*100/(missed+covered), covered, missed+covered }' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "JaCoCo CSV не найден — отчёт не сгенерирован" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload JaCoCo report
        if: always()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/upload-artifact@v5
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      
      - name: Upload surefire reports
        if: failure()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/upload-artifact@v5
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/

  # AGENTS R6: миграции обязаны поднимать СУЩЕСТВУЮЩУЮ БД, а не только пустую.
  # AU-02 (внешний аудит 30.10.2026): ни один workflow этого не проверял, поэтому сломанный
  # remedy для удалённых V14/V15 («Detected applied migration not resolved locally: 14» —
  # backend не стартует на БД старше 28.10.2026) прожил незамеченным.
  #
  # Схема прогона:
  #   1) БД поднимается миграциями ПРЕДЫДУЩЕЙ версии (тег, либо base PR, либо HEAD^) —
  #      это «volume владельца до git pull»;
  #   2) поверх неё стартует ТЕКУЩИЙ backend (jar): Flyway migrate+validate и
  #      hibernate ddl-auto=validate проходят по уже существующей схеме;
  #   3) /api/v1/meta отвечает 200, flyway validate зелёный, максимальная версия текущего
  #      дерева записана в flyway_schema_history.
  # Миграции на шаге 1 гоняет официальный образ flyway/flyway версии из pom предыдущего
  # дерева (flyway-maven-plugin в pom не объявлен: для Flyway 10 ему нужна зависимость
  # flyway-database-postgresql в classpath плагина, а в старом дереве её не добавить).
  migration-upgrade:
    name: Migration Upgrade (existing DB)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 # postgres:15-alpine
        env:
          POSTGRES_DB: provision
          POSTGRES_USER: provision
          POSTGRES_PASSWORD: upgrade-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_CI_PASSWORD: upgrade-ci-password
      PG_CI_URL: jdbc:postgresql://localhost:5432/provision

    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # нужны теги и история, чтобы достать предыдущую версию дерева

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'   # синхронно с backend/pom.xml
          cache: maven

      - name: Resolve base ref (previous version of the tree)
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            # последний тег до HEAD, иначе предыдущий коммит ветки
            BASE="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [ -z "$BASE" ]; then
              BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi
          if [ -z "$BASE" ]; then
            echo "::error::Не удалось определить предыдущую версию дерева (нет тегов и одного коммита недостаточно)"
            exit 1
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"
          echo "base ref: $BASE"

      - name: Migrate DB with the PREVIOUS version (creates the «owner volume» state)
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base-ref "${{ steps.base.outputs.ref }}"
          BASE_FLYWAY="$(sed -n 's:.*<flyway.version>\([^<]*\)</flyway.version>.*:\1:p' \
              /tmp/base-ref/backend/pom.xml | head -1)"
          BASE_FLYWAY="${BASE_FLYWAY:-10.10.0}"
          echo "previous tree: ${{ steps.base.outputs.ref }}, flyway $BASE_FLYWAY"
          ls /tmp/base-ref/backend/src/main/resources/db/migration | sort -V | tail -3
          docker run --rm --network host \
            -v /tmp/base-ref/backend/src/main/resources/db/migration:/flyway/sql:ro \
            "flyway/flyway:${BASE_FLYWAY}" \
            -url="$PG_CI_URL" -user=provision -password="$PG_CI_PASSWORD" \
            -baselineOnMigrate=true -connectRetries=30 \
            migrate

      - name: Build current backend
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Start CURRENT backend against the already-migrated DB
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/provision
          SPRING_DATASOURCE_USERNAME: provision
          SPRING_DATASOURCE_PASSWORD: upgrade-ci-password
          # compose требует непустой секрет (fail-fast JwtProperties) — CI-only значение.
          JWT_SECRET: ci-upgrade-secret-key-must-be-at-least-256-bits-long-hs256-okay
        run: |
          set -euo pipefail
          nohup java -jar target/provision-*.jar > ../backend-upgrade.log 2>&1 &
          echo $! > ../backend-upgrade.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/meta > /tmp/meta.json 2>/dev/null; then
              echo "backend поднялся на существующей БД за ~$((attempt * 5)) c"
              cat /tmp/meta.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::backend не стартовал на БД предыдущей версии за 300 c"
          tail -n 120 ../backend-upgrade.log
          exit 1

      - name: Flyway validate + info (current tree)
        run: |
          set -euo pipefail
          CUR_FLYWAY="$(sed -n 's:.*<flyway.version>\([^<]*\)</flyway.version>.*:\1:p' \
              backend/pom.xml | head -1)"
          CUR_FLYWAY="${CUR_FLYWAY:-10.10.0}"
          # Тот же набор ignore-паттернов, что в application.yml (AU-02): гейт обязан
          # проверять ровно тот контракт, с которым стартует приложение.
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            "flyway/flyway:${CUR_FLYWAY}" \
            -url="$PG_CI_URL" -user=provision -password="$PG_CI_PASSWORD" \
            -ignoreMigrationPatterns='*:missing' \
            validate | tee flyway-validate.log
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            "flyway/flyway:${CUR_FLYWAY}" \
            -url="$PG_CI_URL" -user=provision -password="$PG_CI_PASSWORD" \
            -ignoreMigrationPatterns='*:missing' \
            info | tee flyway-info.log
          # Апгрейд действительно состоялся: максимальная версия текущего дерева — в истории.
          MAX_VERSION="$(ls backend/src/main/resources/db/migration \
              | sed -n 's/^V\([0-9]*\)__.*/\1/p' | sort -n | tail -1)"
          echo "ожидаем версию $MAX_VERSION в flyway_schema_history"
          grep -qE "(^|[^0-9])${MAX_VERSION}([^0-9]|$)" flyway-info.log \
            || { echo "::error::миграция V${MAX_VERSION} не применена при апгрейде"; exit 1; }

      - name: Backend startup log
        if: always()
        run: tail -n 200 backend-upgrade.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend-upgrade.pid ]; then
            kill "$(cat backend-upgrade.pid)" 2>/dev/null || true
          fi

      - name: Upload upgrade artifacts
        if: failure()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/upload-artifact@v5
        with:
          name: migration-upgrade-logs
          path: |
            backend-upgrade.log
            flyway-validate.log
            flyway-info.log

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5
      
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      
      - run: npm ci

      - name: Dependency audit (BL-36)
        run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      
      # FIX (T0, гейты CI): typecheck как отдельный blocking-шаг — ловит ошибки
      # вроде parseDate в DatePicker.tsx (react-datepicker v9), которые vite build
      # не проверяет (esbuild стирает типы).
      - name: Typecheck
        run: npm run typecheck
      
      - run: npm run build

      - name: Bundle size gate (BL-47)
        run: |
          set -euo pipefail
          total_gzip=$(node -e "const fs=require('fs');function walk(d){let r=[];for(const f of fs.readdirSync(d,{withFileTypes:true})){const p=require('path').join(d,f.name);if(f.isDirectory())r=r.concat(walk(p));else if(f.name.endsWith('.js'))r.push(p);}return r;}const files=walk('dist');let gz=0;for(const f of files)gz+=require('zlib').gzipSync(fs.readFileSync(f)).length;console.log((gz/1024).toFixed(2));")
          baseline=220.24
          limit=$(awk "BEGIN{printf \"%.2f\", $baseline*1.05}")
          echo "JS gzip total: ${total_gzip} KB (baseline ${baseline} KB, limit ${limit} KB)"
          awk "BEGIN{exit !($total_gzip <= $limit)}" || { echo "::error::Bundle gzip \${total_gzip} KB exceeds limit \${limit} KB"; exit 1; }

      - name: Upload bundle stats (BL-47)
        uses: actions/upload-artifact@v5
        with:
          name: bundle-stats
          path: dist/stats.html

      - name: Frontend tests
        run: npm run test
      - name: Coverage include check (BL-34)
        run: npm run check:coverage-include

      - name: Coverage gate (whitelisted, blocking)
        run: npm run test:coverage

      - name: Coverage summary (two numbers, non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          # Число 1 — по whitelist'у (coverage.include из vitest.config.ts)
          out1=$(npm run test:coverage 2>&1)
          cov1=$(printf '%s' "$out1" | grep 'All files' | head -1 | awk -F'|' '{gsub(/ /,"",$5); print $5}' | tr -d '%')
          # Число 2 — по всему src/
          out2=$(npx vitest run --coverage --coverage.include='src/**/*.{ts,tsx}' 2>&1)
          cov2=$(printf '%s' "$out2" | grep 'All files' | head -1 | awk -F'|' '{gsub(/ /,"",$5); print $5}' | tr -d '%')
          {
            echo "### Frontend coverage (BL-34 R5)"
            echo ""
            echo "- По whitelist'у (coverage.include): **${cov1}%**"
            echo "- По всему src/: **${cov2}%**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "whitelisted=${cov1}% all_src=${cov2}%"
      
      - name: Check MD files (whitelist, BL-45)
        run: |
          set -euo pipefail
          bad=$(git ls-files '*.md' | grep -vE '^(README\.md|ARCHITECTURE\.md|PLAN\.md|AGENTS\.md|backend/README\.md|skills/.*\.md|tasks/.*\.md|provisions/design-pack/.*\.md|plans/backlog\.md|plans/knownbugs\.md)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::MD-файлы вне белого списка (skills/docs-sync.md):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "✅ MD whitelist: $(git ls-files '*.md' | wc -l) файлов"

      - name: Check internal Markdown links (BL-55)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, subprocess, sys
          files = subprocess.check_output(['git','ls-files','*.md'], text=True).splitlines()
          bad = []
          for f in files:
              p = pathlib.Path(f)
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception as e:
                  bad.append((f, f'<read error: {e}>'))
                  continue
              for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
                  link = m.group(1).strip()
                  if link.startswith(('http://','https://','#','mailto:')):
                      continue
                  target = (p.parent / link.split('#')[0])
                  if not target.exists():
                      bad.append((f, link))
          if bad:
              for f, l in bad:
                  print(f'{f}: {l}')
              sys.exit(1)
          print(f'OK: internal links checked in {len(files)} MD files')
          PY
      
      - name: Upload vitest reports
        if: failure()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/upload-artifact@v5
        with:
          name: frontend-vitest
          path: coverage/

  e2e:
    name: E2E (Playwright, BL-32)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5
      
      # compose fail-fast без JWT_SECRET (${JWT_SECRET:?...}) — задаём CI-only секрет.
      # Значение не используется в рантайме (config/build только интерполируют файл),
      # уникальный рабочий секрет генерируется в workflow docker-stack.yml.
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=ci-only-secret-key-not-for-production-0123456789abcdef|" .env
          grep -q "^JWT_SECRET=" .env && echo "JWT_SECRET set"
      
      - run: docker compose config -q
      
      - run: docker build -t provision-backend:ci ./backend
      
      - run: docker build -t provision-frontend:ci -f Dockerfile.frontend .

  security:
    name: Security Scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5
      
      - name: Semgrep (blocking)
        run: |
          pip install semgrep
          semgrep scan --config auto --error
      
      - name: Dependency Review
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/dependency-review-action@v5
      
      - name: Trivy FS scan
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'

  # KB-18: E2E-nightly real-mode regression
  e2e-nightly:
    name: E2E Nightly (real-mode)
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    schedule:
      - cron: '0 6 * * 1'  # Пн 06:00 UTC
    timeout-minutes: 45

    services:
      postgres:
        image: postgres@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 # postgres:15-alpine
        env:
          POSTGRES_DB: provision
          POSTGRES_USER: provision
          POSTGRES_PASSWORD: e2e-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/provision
      SPRING_DATASOURCE_USERNAME: provision
      SPRING_DATASOURCE_PASSWORD: e2e-ci-password
      JWT_SECRET: e2e-nightly-secret-key-at-least-256-bits-hs256-ok
      PLAYWRIGHT_SKIP_DOWNLOAD: 1

    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v5

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install PostgreSQL 15 (for integration tests)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          if ! apt-cache show postgresql-15 >/dev/null 2>&1; then
            sudo apt-get install -yq --no-install-recommends curl ca-certificates gnupg
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql-pgdg.gpg
            echo "deb [signed-by=/etc/apt/keyrings/postgresql-pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -qq
          fi
          if apt-cache show postgresql-15 >/dev/null 2>&1; then
            sudo apt-get install -yq --no-install-recommends postgresql-15
          else
            sudo apt-get install -yq --no-install-recommends postgresql
          fi
          psql --version || true

      - name: Backend integration tests (real-mode)
        working-directory: backend
        run: mvn -B -ntp verify

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Frontend e2e tests (real API)
        run: |
          npm ci
          npx playwright test --project=real

      - name: Upload e2e artifacts
        if: failure()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/upload-artifact@v5
        with:
          name: e2e-nightly-logs
          path: |
            backend/target/surefire-reports/
            backend/target/test-classes/**/logs/
            playwright-report/
