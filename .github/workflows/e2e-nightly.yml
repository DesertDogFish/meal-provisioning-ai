name: E2E (Playwright) nightly

on:
  schedule:
    - cron: '30 3 * * *'  # Каждый день в 3:30 UTC (после contract-nightly в 3:00)
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mock:
    name: Playwright e2e (mock mode, BL-33)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v7

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e (mock mode)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npx playwright test $(ls e2e/*.spec.ts | grep -v real-mode.spec.ts)

      - name: Upload Playwright report
        if: always()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-mock
          path: playwright-report/
          retention-days: 7

  e2e-real:
    name: Playwright e2e (real mode, BL-33)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'pull_request'

    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v7

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start docker compose stack (real mode)
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.debug.yml
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48)|" .env
          docker compose up -d --build
          for c in provision-backend provision-frontend; do
            for i in $(seq 1 60); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo starting)
              [ "$st" = healthy ] && break
              sleep 5
            done
            docker inspect -f '{{.Name}} {{.State.Health.Status}}' "$c"
          done

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e REAL mode (P0-3 regression)
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_BACKEND_URL: http://localhost:8080
        run: npx playwright test e2e/real-mode.spec.ts

      - name: Tear down stack
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.debug.yml
        run: docker compose down -v

      - name: Upload Playwright report
        if: always()
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-real
          path: playwright-report/
          retention-days: 7
