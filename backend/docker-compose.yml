version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: provision-postgres
    environment:
      POSTGRES_DB: provision
      POSTGRES_USER: provision
      POSTGRES_PASSWORD: provision123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provision"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: provision-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/provision
      SPRING_DATASOURCE_USERNAME: provision
      SPRING_DATASOURCE_PASSWORD: provision123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: "your-256-bit-secret-key-for-jwt-tokens-change-in-production-environment-please"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
