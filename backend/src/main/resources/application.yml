spring:
  application:
    name: provision

  datasource:
    url: jdbc:postgresql://localhost:5432/provision
    username: provision
    password: provision123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # FIX (скрытый N+1 по категориям ингредиентов): схлопывает последовательные
        # инициализации LAZY-проксей в пакетные запросы «where id in (?, ...)»
        # вместо одного select на каждую проксию (см. SummaryService.initializeCategoryProxies).
        default_batch_fetch_size: 50
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000  # 1 hour
  refresh-token-expiration: 604800000  # 7 days

# CORS для прямых запросов с фронтенда (vite dev-сервер -> :8080).
# В docker-сценарии фронт идёт через nginx same-origin и CORS не задействован.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

integration:
  off:
    products-url: https://world.openfoodfacts.org
    # Цены через OFF НЕ синхронизируются: OFF не предоставляет актуальные
    # локальные цены в RUB для РФ. Провайдер используется только для
    # идентификации/обогащения карточек продуктов (штрихкод, название,
    # бренд, фасовка, фото). Цены вводятся вручную или импортируются
    # из другого источника.

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# FIX (шум в логах + диагностика N+1): org.hibernate.orm.results логирует каждый
# извлечённый JDBC-столбец («Extracted JDBC value») — тысячи строк на один запрос.
# Держим Hibernate на WARN, но SQL оставляем DEBUG — это полезный инструмент
# для отслеживания N+1 (число «select ... from ingredients where id=?» и т.п.).
logging:
  level:
    root: INFO
    com.provision: DEBUG          # наш код — можно DEBUG в dev
    org.hibernate: WARN           # ← ГЛАВНОЕ: убиваем шум orm.results
    org.hibernate.SQL: DEBUG      # SQL-запросы оставляем DEBUG (полезно для диагностики N+1)
    org.hibernate.orm.results: WARN   # конкретно этот логгер — источник шума
    org.hibernate.type.descriptor.sql: WARN
    org.springframework: INFO
    org.springframework.security: WARN