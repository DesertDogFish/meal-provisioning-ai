spring:
  application:
    name: provision

  datasource:
    url: jdbc:postgresql://localhost:5432/provision
    username: provision
    # Пароль БД — только из окружения (аудит 29.10.2026: статический дефолт удалён).
    # Локально: export POSTGRES_PASSWORD=... (или SPRING_DATASOURCE_PASSWORD=...), см. backend/README.md.
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # FIX (скрытый N+1 по категориям ингредиентов): схлопывает последовательные
        # инициализации LAZY-проксей в пакетные запросы «where id in (?, ...)»
        # вместо одного select на каждую проксию (см. SummaryService.initializeCategoryProxies).
        default_batch_fetch_size: 50
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # AU-02 (внешний аудит 30.10.2026): миграции V14/V15 (сид демо-юзеров) были удалены из
    # дерева в af5f2248 — до того, как их успели применить широко, но БД владельца и любой
    # деплой старше этой даты держат их в flyway_schema_history. Без этой настройки Flyway
    # валидирует историю при каждом старте (validateOnMigrate=true по умолчанию) и падает:
    # «Detected applied migration not resolved locally: 14» — приложение не поднимается
    # вовсе, до всякой бизнес-логики. Прежний совет в README («удалите демо-юзеров вручную»)
    # не лечил: DELETE FROM users не убирает строки из flyway_schema_history.
    #
    # Почему безопасно именно здесь: V14/V15 были ЧИСТЫМ сидом (INSERT демо-юзеров), от них
    # не зависит ни одна схема/данные, а их содержимое заменено DevDataInitializer'ом
    # (profile dev + SEED_DEMO_USERS). «missing» = «применена в БД, отсутствует локально»,
    # то есть игнорируется ровно этот случай.
    #
    # Чего НЕ игнорируем (намеренно):
    #  - "*:future" — БД впереди кода. Откат образа после V28 (дроп ingredient_mappings/
    #    external_products, сужение CHECK-ов) оставил бы старый код без таблиц: падение
    #    на старте здесь полезнее молчаливой работы на несовместимой схеме;
    #  - "*:pending" — незапущенная локальная миграция должна накатываться, а не игнорироваться;
    #  - checksum mismatch — правка уже применённой миграции обязана быть замечена (AGENTS §8:
    #    применённые миграции не править и не удалять).
    # Регресс-гейт: FlywayUpgradeIntegrationTest (БД с V14/V15 в истории обязана стартовать)
    # и CI-job migration-upgrade (подъём существующей БД предыдущей версией, затем текущей).
    ignore-migration-patterns: "*:missing"

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Загрузка выгрузки ЕМИСС файлом («Интеграции → Загрузить файл выгрузки», Запуск №17).
  # Полная SDMX-выгрузка показателя — 65 МБ, поэтому лимит совпадает по смыслу с
  # integration.rosstat.max-response-bytes (96 МБ); содержимое файла дополнительно проверяет
  # провайдер (размер + признак SDMX). Согласовано также с client_max_body_size в nginx.conf
  # и с MAX_UPLOAD_BYTES в src/pages/IntegrationsPage.tsx.
  servlet:
    multipart:
      max-file-size: ${EMIS_UPLOAD_MAX_FILE_SIZE:96MB}
      max-request-size: ${EMIS_UPLOAD_MAX_FILE_SIZE:96MB}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Аудит 29.10.2026, подзадача 18: метрики и health (Micrometer + Prometheus).
# exposure намеренно НЕ "*": env/heapdump/threaddump публично — дыра; наружу только
# health/info/metrics/prometheus, остальное — за ролью ADMIN (SecurityConfig).
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000  # 1 hour
  refresh-token-expiration: 604800000  # 7 days
  # FIX (аудит 29.10.2026, подзадача 5): issuer/audience пишутся в каждый access-токен
  # и требуются при разборе — токен, выпущенный другим сервисом с тем же алгоритмом,
  # отклоняется. Значения по умолчанию подходят одиночному деплою; при нескольких
  # окружениях на одном секрете — переопределить JWT_ISSUER/JWT_AUDIENCE.
  issuer: ${JWT_ISSUER:provision}
  audience: ${JWT_AUDIENCE:provision-api}

# Dev-профиль: сид демо-данных (DevDataInitializer/DevTripsInitializer).
# FIX (аудит 29.10.2026, подзадача 1, CRITICAL): пароли демо-пользователей НЕ хардкодятся.
# Пустое значение ADMIN_PASSWORD/DEMO_USER_PASSWORD — при старте генерируется случайный
# пароль и печатается в лог backend'а (dev-профиль — локальный инструмент).
dev:
  seed-demo-users: ${SEED_DEMO_USERS:false}
  admin-password: ${ADMIN_PASSWORD:}
  user-password: ${DEMO_USER_PASSWORD:}

# CORS для прямых запросов с фронтенда (vite dev-сервер -> :8080).
# В docker-сценарии фронт идёт через nginx same-origin и CORS не задействован.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Версия приложения (дефект KB-4: свойства не было, и User-Agent всегда говорил «0.0.0»).
# Единственный источник истины — backend/pom.xml (<version>): spring-boot-starter-parent
# включает фильтрацию ресурсов, поэтому @project.version@ в собранном application.yml
# заменяется на версию pom (сейчас 1.0.1). APP_VERSION переопределяет её без пересборки.
# Ту же версию spring-boot-maven-plugin кладёт в META-INF/build-info.properties внутри jar.
app:
  version: ${APP_VERSION:@project.version@}

integration:
  # Контактный email для User-Agent внешних интеграций (вежливость публичных API).
  contact-email: ${INTEGRATION_CONTACT_EMAIL:dev@provision.app}
  # Росстат (ЕМИСС) — официальные средние потребительские цены на товары и услуги
  # (рубли, ежемесячно, по регионам РФ). Единственная интеграция приложения.
  #
  # Протокол (референс — CRAN-пакет fedstatAPIr, активно поддерживается):
  #   1. GET {base-url}/indicator/{indicator-id} — страница показателя (cookie-сессия);
  #   2. одноразовый Struts CSRF-токен из div#downloadTokenHolder;
  #   3. POST {base-url}/indicator/downloadData.do?format=sdmx — тело: title,
  #      struts.token.name, <имя токена со страницы>=<токен>, id=<indicator-id>,
  #      lineObjectIds/columnObjectIds, selectedFilterIds, filterObjectIds.
  #      Имя CSRF-поля НЕ хардкодится: на fedstat.ru struts.token.name = «token».
  #      POST выполняется БЕЗ следования редиректам — 302 означает «портал отклонил
  #      набор фильтров», а не перенаправление. Ответ — SDMX GenericData XML:
  #      CodeLists всегда полные (885 товаров, 450 ОКАТО) независимо от выбранных
  #      фильтров, поэтому одна выгрузка обновляет весь локальный справочник;
  #      в рядах месяц — атрибут ряда (PERIOD, «январь»), год — внутри Obs/Time.
  #
  # Портал — только транспорт. Выгрузка укладывается в локальную копию
  # (emis_products/emis_prices, V26), а поиск позиций для привязки и цены читаются уже
  # из нашей БД (EmisCatalogService) — UI не зависит от доступности fedstat.ru.
  # Кэша нет намеренно: единственная точка входа — кнопка «Синхронизировать»,
  # и её смысл — положить в БД свежие данные, а не отдать вчерашние.
  # ВНИМАНИЕ: ЕМИСС блокирует зарубежные дата-центры (403 анти-бот) — работает из сети РФ.
  rosstat:
    base-url: ${ROSSTAT_BASE_URL:https://www.fedstat.ru}
    # 31448 = «Средние потребительские цены на товары и услуги» (ежемесячно, регионы+товары).
    # Альтернатива: 37426 = «Еженедельные средние потребительские цены (тарифы)…».
    indicator-id: ${ROSSTAT_INDICATOR_ID:31448}
    # Название региона из справочника ОКАТО — уходит в форму выгрузки. По решению владельца
    # берётся «Российская Федерация без учета новых субъектов (с 01.01.2023)», а не «643».
    region: ${ROSSTAT_REGION:Российская Федерация без учета новых субъектов (с 01.01.2023)}
    # Код того же региона (ОКАТО). Под ним точки ложатся в emis_prices и по нему же читаются;
    # используется как fallback, если в ответе портала нет измерения территорий.
    region-code: ${ROSSTAT_REGION_CODE:643004.АГ}
    # Версия — из app.version (pom.xml), иначе портал видит «provision/unknown» (KB-4).
    user-agent: ${ROSSTAT_USER_AGENT:${spring.application.name:ProvisionApp}/${app.version:unknown} (${integration.contact-email:dev@provision.app})}
    # Сколько последних ЛЕТ храним в локальной копии (решение владельца: два года, не больше).
    # Точки вне окна отбрасываются при записи, устаревшие — удаляются из таблицы.
    period-years: ${ROSSTAT_PERIOD_YEARS:2}
    # Сколько последних месяцев запрашивать у портала (ось «Период»); 0 или меньше — все 12.
    # ПОЧЕМУ МЕСЯЦЫ, А НЕ ГОДЫ: портал отклоняет (302) ЛЮБОЕ сужение оси «Год» — проверено
    # на 2026+2025 и на 2023+2024 (эксперименты E1/E2 плана
    # plans/done/2026-10-28-emis-download-csrf-and-volume.md). Сужение «Периода» и «Товаров»
    # принимает (F1/F2). Год уходит целиком, окно хранения режет EmisMirrorService.
    # Дефолт 0 (все месяцы): для окна «два года» нужна полная история месяцев, а объём
    # ответа ограничен одним регионом и предохранителем max-response-bytes.
    period-months: ${ROSSTAT_PERIOD_MONTHS:0}
    # Предохранитель от runaway-ответа (дефект №6). С 29.10.2026 разбор ПОТОКОВЫЙ (StAX,
    # KB-1): ответ больше лимита не «отказывается», а ОБРЫВАЕТСЯ при чтении с внятной причиной.
    # Память от объёма ответа больше не зависит — 66 МБ разбирались в 128 МБ heap (проверено),
    # поэтому лимит держит полный ряд (65 МБ) с запасом и окно выгрузки можно расширять.
    max-response-bytes: ${ROSSTAT_MAX_RESPONSE_BYTES:100663296}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# FIX (шум в логах + диагностика N+1): org.hibernate.orm.results логирует каждый
# извлечённый JDBC-столбец («Extracted JDBC value») — тысячи строк на один запрос.
# Держим Hibernate на WARN, но SQL оставляем DEBUG — это полезный инструмент
# для отслеживания N+1 (число «select ... from ingredients where id=?» и т.п.).
logging:
  # traceId в каждой строке лога (TraceIdFilter: X-Request-Id или сгенерированный UUID);
  # фоновые @Async-потоки наследуют MDC через AsyncConfig.mdcTaskDecorator (аудит, подзадача 15).
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    root: INFO
    com.provision: DEBUG          # наш код — можно DEBUG в dev
    org.hibernate: WARN           # ← ГЛАВНОЕ: убиваем шум orm.results
    org.hibernate.SQL: DEBUG      # SQL-запросы оставляем DEBUG (полезно для диагностики N+1)
    org.hibernate.orm.results: WARN   # конкретно этот логгер — источник шума
    org.hibernate.type.descriptor.sql: WARN
    org.springframework: INFO
    org.springframework.security: WARN