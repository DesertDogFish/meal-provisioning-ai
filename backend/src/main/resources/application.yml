spring:
  application:
    name: provision

  datasource:
    url: jdbc:postgresql://localhost:5432/provision
    username: provision
    password: provision123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # FIX (скрытый N+1 по категориям ингредиентов): схлопывает последовательные
        # инициализации LAZY-проксей в пакетные запросы «where id in (?, ...)»
        # вместо одного select на каждую проксию (см. SummaryService.initializeCategoryProxies).
        default_batch_fetch_size: 50
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Загрузка выгрузки ЕМИСС файлом («Интеграции → Загрузить файл выгрузки», Запуск №17).
  # Полная SDMX-выгрузка показателя — десятки мегабайт, поэтому транспортный лимит совпадает
  # по смыслу с integration.rosstat.max-response-bytes (32 МБ); содержимое файла дополнительно
  # проверяет провайдер (размер + признак SDMX).
  servlet:
    multipart:
      max-file-size: ${EMIS_UPLOAD_MAX_FILE_SIZE:32MB}
      max-request-size: ${EMIS_UPLOAD_MAX_FILE_SIZE:32MB}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000  # 1 hour
  refresh-token-expiration: 604800000  # 7 days

# CORS для прямых запросов с фронтенда (vite dev-сервер -> :8080).
# В docker-сценарии фронт идёт через nginx same-origin и CORS не задействован.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

integration:
  # Контактный email для User-Agent внешних интеграций (вежливость публичных API).
  contact-email: ${INTEGRATION_CONTACT_EMAIL:dev@provision.app}
  # Росстат (ЕМИСС) — официальные средние потребительские цены на товары и услуги
  # (рубли, ежемесячно, по регионам РФ). Единственная интеграция приложения.
  #
  # Протокол (референс — CRAN-пакет fedstatAPIr, активно поддерживается):
  #   1. GET {base-url}/indicator/{indicator-id} — страница показателя (cookie-сессия);
  #   2. одноразовый Struts CSRF-токен из div#downloadTokenHolder;
  #   3. POST {base-url}/indicator/downloadData.do?format=sdmx — тело: title,
  #      struts.token.name, <имя токена со страницы>=<токен>, id=<indicator-id>,
  #      lineObjectIds/columnObjectIds, selectedFilterIds, filterObjectIds.
  #      Имя CSRF-поля НЕ хардкодится: на fedstat.ru struts.token.name = «token».
  #      POST выполняется БЕЗ следования редиректам — 302 означает «портал отклонил
  #      набор фильтров», а не перенаправление. Ответ — SDMX GenericData XML:
  #      CodeLists всегда полные (885 товаров, 450 ОКАТО) независимо от выбранных
  #      фильтров, поэтому одна выгрузка обновляет весь локальный справочник;
  #      в рядах месяц — атрибут ряда (PERIOD, «январь»), год — внутри Obs/Time.
  #
  # Портал — только транспорт. Выгрузка укладывается в локальную копию
  # (emis_products/emis_prices, V26), а поиск позиций для привязки и цены читаются уже
  # из нашей БД (EmisCatalogService) — UI не зависит от доступности fedstat.ru.
  # Кэша нет намеренно: единственная точка входа — кнопка «Синхронизировать»,
  # и её смысл — положить в БД свежие данные, а не отдать вчерашние.
  # ВНИМАНИЕ: ЕМИСС блокирует зарубежные дата-центры (403 анти-бот) — работает из сети РФ.
  rosstat:
    base-url: ${ROSSTAT_BASE_URL:https://www.fedstat.ru}
    # 31448 = «Средние потребительские цены на товары и услуги» (ежемесячно, регионы+товары).
    # Альтернатива: 37426 = «Еженедельные средние потребительские цены (тарифы)…».
    indicator-id: ${ROSSTAT_INDICATOR_ID:31448}
    # Название региона из справочника ОКАТО — уходит в форму выгрузки. По решению владельца
    # берётся «Российская Федерация без учета новых субъектов (с 01.01.2023)», а не «643».
    region: ${ROSSTAT_REGION:Российская Федерация без учета новых субъектов (с 01.01.2023)}
    # Код того же региона (ОКАТО). Под ним точки ложатся в emis_prices и по нему же читаются;
    # используется как fallback, если в ответе портала нет измерения территорий.
    region-code: ${ROSSTAT_REGION_CODE:643004.АГ}
    user-agent: ${ROSSTAT_USER_AGENT:${spring.application.name:ProvisionApp}/${app.version:0.0.0} (${integration.contact-email:dev@provision.app})}
    # Сколько последних ЛЕТ храним в локальной копии (решение владельца: два года, не больше).
    # Точки вне окна отбрасываются при записи, устаревшие — удаляются из таблицы.
    period-years: ${ROSSTAT_PERIOD_YEARS:2}
    # Сколько последних месяцев запрашивать у портала (ось «Период»); 0 или меньше — все 12.
    # ПОЧЕМУ МЕСЯЦЫ, А НЕ ГОДЫ: портал отклоняет (302) ЛЮБОЕ сужение оси «Год» — проверено
    # на 2026+2025 и на 2023+2024 (эксперименты E1/E2 плана
    # plans/done/2026-10-28-emis-download-csrf-and-volume.md). Сужение «Периода» и «Товаров»
    # принимает (F1/F2). Год уходит целиком, окно хранения режет EmisMirrorService.
    # Дефолт 0 (все месяцы): для окна «два года» нужна полная история месяцев, а объём
    # ответа ограничен одним регионом и предохранителем max-response-bytes.
    period-months: ${ROSSTAT_PERIOD_MONTHS:0}
    # Предохранитель от OOM (дефект №6): ответ больше этого размера не парсим —
    # 65 МБ XML это ~130 МБ String и пик 600–700 МБ heap на DOM.
    max-response-bytes: ${ROSSTAT_MAX_RESPONSE_BYTES:33554432}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# FIX (шум в логах + диагностика N+1): org.hibernate.orm.results логирует каждый
# извлечённый JDBC-столбец («Extracted JDBC value») — тысячи строк на один запрос.
# Держим Hibernate на WARN, но SQL оставляем DEBUG — это полезный инструмент
# для отслеживания N+1 (число «select ... from ingredients where id=?» и т.п.).
logging:
  level:
    root: INFO
    com.provision: DEBUG          # наш код — можно DEBUG в dev
    org.hibernate: WARN           # ← ГЛАВНОЕ: убиваем шум orm.results
    org.hibernate.SQL: DEBUG      # SQL-запросы оставляем DEBUG (полезно для диагностики N+1)
    org.hibernate.orm.results: WARN   # конкретно этот логгер — источник шума
    org.hibernate.type.descriptor.sql: WARN
    org.springframework: INFO
    org.springframework.security: WARN