<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Провиант загружается">
  <!-- Прелоадер v5: парус растёт от ватерлинии, снежный пик опускается сверху,
       ватерлиния дрейфует, отражение дышит. SMIL: анимируется даже через <img>. -->
  <defs>
    <linearGradient id="ps" x1="-8.6" y1="-33.7" x2="17.3" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC46B"/><stop offset=".55" stop-color="#F08A2E"/><stop offset="1" stop-color="#E4571B"/>
    </linearGradient>
  </defs>

  <!-- отражение -->
  <path d="M35 64 L60.8 64 L46.5 77.4 Z" fill="#C46A2A">
    <animate attributeName="opacity" values=".12;.35;.12" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- парус: рост от ватерлинии (scale по Y вокруг точки 48,60) -->
  <g transform="translate(48 60)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 .5;1 1;1 1;1 .5" keyTimes="0;.35;.8;1" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-8.6 -33.7 Q7.1 -20.8 17.3 0 L-8.6 0 Z" fill="url(#ps)" stroke="url(#ps)" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- снежный пик: опускается и проявляется -->
  <path d="M39.2 19.1 L43.9 24.8 L42 23.6 L40.6 24.8 L39.2 23.6 L37.8 24.8 L36.4 23.6 L34.5 24.8 Z" fill="#F5F2EA" stroke="#F5F2EA" stroke-width="1" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 -7;0 0;0 0;0 -7" keyTimes="0;.3;.85;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.3;.85;1" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- ватерлиния: дрейф -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-2 0;2 0;-2 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M25.3 62.1 C29.1 61 32.8 63.2 36.6 62.1 C40.4 61 44.1 63.2 47.9 62.1 C51.7 61 55.4 63.2 59.2 62.1 C63 61 66.7 63.2 70.5 62.1" stroke="#F5F2EA" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
