services:
  postgres:
    image: postgres:15-alpine
    container_name: provision-postgres
    environment:
      POSTGRES_DB: provision
      POSTGRES_USER: provision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provision"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - provision-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: provision-backend
    # BL-18: лимит памяти виден в compose, а не в комментарии. Heap считается от него
    # (Dockerfile: -XX:MaxRAMPercentage=70.0). Потоковый разбор SDMX (KB-1) разбирает ответ
    # 66 МБ в 128 МБ heap, поэтому 1 ГБ покрывает и выгрузку, и применение цен в БД.
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/provision
      SPRING_DATASOURCE_USERNAME: provision
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Fix-13 (интеграция): Росстат/ЕМИСС (fedstat.ru) — официальные средние
      # потребительские цены. Ключи/пароли НЕ нужны; переменные ниже — только
      # для переопределения дефолтов (показатель 31448 = месячные цены, регион РФ).
      # ВНИМАНИЕ: ЕМИСС блокирует зарубежные дата-центры (403 анти-бот) —
      # контейнер должен выходить в интернет из сети РФ (как и хост пользователя).
      ROSSTAT_INDICATOR_ID: ${ROSSTAT_INDICATOR_ID:-31448}
      ROSSTAT_REGION: ${ROSSTAT_REGION:-Российская Федерация без учета новых субъектов (с 01.01.2023)}
      ROSSTAT_REGION_CODE: ${ROSSTAT_REGION_CODE:-643004.АГ}
      # Сколько последних месяцев выгружать из поля «Период». Полный ряд ЕМИСС даёт ответ
      # ~65 МБ; с 29.10.2026 разбор ПОТОКОВЫЙ (StAX, KB-1): 66 МБ разбираются в 128 МБ heap,
      # поэтому 0 (все 12 месяцев) больше не требует гигантского -Xmx. 1 месяц ≈ 5,6 МБ,
      # 2 ≈ 11 МБ. Сужать поле «Год» нельзя — портал отвечает 302 (см. ARCHITECTURE.md).
      ROSSTAT_PERIOD_MONTHS: ${ROSSTAT_PERIOD_MONTHS:-0}
      ROSSTAT_PERIOD_YEARS: ${ROSSTAT_PERIOD_YEARS:-2}
      # Предохранитель от runaway-ответа: при превышении ЧТЕНИЕ обрывается (раньше отказ
      # случался уже после полной загрузки ответа в память). 96 МБ — с запасом над полным
      # рядом 65 МБ, чтобы окно выгрузки можно было расширять.
      ROSSTAT_MAX_RESPONSE_BYTES: ${ROSSTAT_MAX_RESPONSE_BYTES:-100663296}
      # Лимит ручной загрузки выгрузки ЕМИСС (multipart) — см. также client_max_body_size в nginx.conf
      EMIS_UPLOAD_MAX_FILE_SIZE: ${EMIS_UPLOAD_MAX_FILE_SIZE:-96MB}
      INTEGRATION_CONTACT_EMAIL: ${INTEGRATION_CONTACT_EMAIL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - provision-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api/v1
        - VITE_API_MODE=real
    container_name: provision-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - provision-network

volumes:
  postgres_data:

networks:
  provision-network:
    driver: bridge