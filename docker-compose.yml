services:
  postgres:
    image: postgres:15-alpine
    container_name: provision-postgres
    environment:
      POSTGRES_DB: provision
      POSTGRES_USER: provision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provision123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provision"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - provision-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: provision-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/provision
      SPRING_DATASOURCE_USERNAME: provision
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-provision123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Open Food Facts: READ-запросы (поиск продуктов) анонимные — учётная
      # запись не требуется и больше НЕ передаётся (user_id/password убраны
      # из GET-запросов согласно документации OFF).
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - provision-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api/v1
        - VITE_API_MODE=real
    container_name: provision-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - provision-network

volumes:
  postgres_data:

networks:
  provision-network:
    driver: bridge