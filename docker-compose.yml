services:
  postgres:
    image: postgres@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984  # postgres:15-alpine
    container_name: provision-postgres
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    pids_limit: 256
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: provision
      POSTGRES_USER: provision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provision"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - provision-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: provision-backend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/provision
      SPRING_DATASOURCE_USERNAME: provision
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ROSSTAT_INDICATOR_ID: ${ROSSTAT_INDICATOR_ID:-31448}
      ROSSTAT_REGION: ${ROSSTAT_REGION:-Российская Федерация без учета новых субъектов (с 01.01.2023)}
      ROSSTAT_REGION_CODE: ${ROSSTAT_REGION_CODE:-643004.АГ}
      ROSSTAT_PERIOD_MONTHS: ${ROSSTAT_PERIOD_MONTHS:-0}
      ROSSTAT_PERIOD_YEARS: ${ROSSTAT_PERIOD_YEARS:-2}
      ROSSTAT_MAX_RESPONSE_BYTES: ${ROSSTAT_MAX_RESPONSE_BYTES:-100663296}
      EMIS_UPLOAD_MAX_FILE_SIZE: ${EMIS_UPLOAD_MAX_FILE_SIZE:-96MB}
      INTEGRATION_CONTACT_EMAIL: ${INTEGRATION_CONTACT_EMAIL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - provision-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api/v1
        - VITE_API_MODE=real
    container_name: provision-frontend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    pids_limit: 128
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - provision-network

volumes:
  postgres_data:

networks:
  provision-network:
    driver: bridge